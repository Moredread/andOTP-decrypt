name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Set up poetry
      uses: abatilo/actions-poetry@v4

    - name: Install Dependencies
      run: poetry install
    
    - name: Test
      run: poetry run pytest
